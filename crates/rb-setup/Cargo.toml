[package]
name = "rb-setup"
version.workspace = true
edition.workspace = true
description = "Installatieprogramma van MathPrime (egui): uitpakken, installeren, starten"

[[bin]]
name = "mathprime-setup"
path = "src/main.rs"

[dependencies]
rb-zipxml = { path = "../rb-zipxml" }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "accesskit", "x11", "wayland"] }
rfd = "0.17"
